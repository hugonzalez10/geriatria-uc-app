<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Geriatría UC · Guía del rotante</title>
<!--
  ============================================================
  Geriatría UC · Guía del rotante — Prototipo v0.3
  ------------------------------------------------------------
  Archivo único, autocontenido (HTML + CSS + JS vanilla).
  Funciona abriéndolo directamente (file://) y sin conexión.
  Los datos del Directorio, enlaces propios, pauta y calendario
  se guardan en localStorage del navegador del celular. Los
  borradores de plantillas clínicas se guardan SOLO en
  sessionStorage (se borran al cerrar la pestaña/navegador).

  PRIVACIDAD: la app no contiene datos de pacientes. Las
  plantillas piden edad/cama, nunca nombre ni RUT.

  SECCIONES DEL ARCHIVO (buscar por el rótulo):
    [CSS]   Estilos (variables de color, layout, componentes)
    [HTML]  Estructura: cabecera, 5 vistas, barra inferior
    [JS-0]  Utilidades y navegación entre pestañas
    [JS-1]  Rotación (bienvenida, semana tipo, reglas por rotante, sedes, checklist)
    [JS-2]  Calculadoras (definiciones de escalas y motor genérico; 25 escalas)
    [JS-3]  Directorio (editable, localStorage, exportar/importar)
    [JS-4]  Recursos (enlaces fijos + enlaces propios)
    [JS-6]  Plantillas (ingreso HGG, entrega de turno, interconsulta, evolución) → texto plano para TrakCare
    [JS-7]  Más: Equipo, Checklists, Glosario, Pauta de evaluación, Calendarios 2026 + Mi semana, Recursos
    [JS-8]  v0.3: Avisos (banner editable), Equipo/Organigrama, Poli SJ, Turnos FDS, Calendarios 2026, Mi semana
    [JS-5]  Arranque
  ============================================================
-->
<style>
/* ========================= [CSS] ========================= */
:root{
  --uc:#003366;          /* azul institucional UC */
  --uc-2:#0a4f8f;        /* azul secundario */
  --uc-soft:#e6eef7;     /* fondo suave azul */
  --bg:#f4f6f9;
  --card:#ffffff;
  --text:#1b2430;
  --muted:#5e6b7a;
  --line:#dfe5ec;
  --ok:#1f7a4d;  --ok-bg:#e4f4ea;
  --warn:#9a6b00; --warn-bg:#fff4d6;
  --bad:#a62626; --bad-bg:#fde7e7;
  --radius:14px;
  --nav-h:64px;
  --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--uc-2)}

/* Cabecera */
header.top{position:sticky;top:0;z-index:20;background:var(--uc);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
header.top .back{display:none;background:none;border:0;color:#fff;font-size:26px;line-height:1;
  min-width:var(--tap);min-height:40px;margin-left:-8px;cursor:pointer}
header.top.has-back .back{display:block}
header.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header.top small{display:block;font-size:12px;opacity:.8;font-weight:400}

/* Contenido */
main{padding:14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:720px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 8px;color:var(--uc)}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--uc-2)}
.card p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.ph{background:#fff7cc;border-bottom:2px dotted #c9a400;padding:0 3px;border-radius:3px}
.note{background:var(--uc-soft);border-left:4px solid var(--uc);padding:10px 12px;border-radius:8px;font-size:14px;margin:10px 0}
.note.warn{background:var(--warn-bg);border-color:var(--warn)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
  padding:10px 16px;border-radius:12px;border:1px solid var(--uc);background:var(--uc);color:#fff;
  font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn.secondary{background:#fff;color:var(--uc)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text);font-weight:500}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}

/* Lista de ítems (menú de calculadoras / directorio) */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;min-height:60px;cursor:pointer;text-align:left;width:100%}
.item .ic{width:40px;height:40px;border-radius:10px;background:var(--uc-soft);color:var(--uc);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.item .t{flex:1}
.item .t b{display:block;font-size:15px}
.item .t span{font-size:13px;color:var(--muted)}
.item .chev{color:var(--muted);font-size:20px}

/* Formularios */
.field{margin:12px 0}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input[type=number],.field input[type=text],.field input[type=tel],.field select,.field textarea{
  width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:90px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex:1;min-width:46%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;min-height:var(--tap);background:#fff;font-weight:500;font-size:14px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--uc);background:var(--uc-soft)}
.seg input{width:20px;height:20px;accent-color:var(--uc);flex-shrink:0}
.opt{display:block}
.opt label{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:8px;background:#fff;cursor:pointer;font-size:14px}
.opt label:has(input:checked){border-color:var(--uc);background:var(--uc-soft)}
.opt input{width:20px;height:20px;accent-color:var(--uc);margin-top:2px;flex-shrink:0}
.opt .pts{margin-left:auto;font-weight:700;color:var(--uc);white-space:nowrap}
.qtitle{font-weight:600;font-size:15px;margin:14px 0 6px}
.qhelp{font-size:13px;color:var(--muted);margin:-4px 0 8px}

/* Resultado */
.result{margin-top:14px;padding:14px;border-radius:12px;background:var(--uc-soft);border:1px solid #c7d7ea}
.result .score{font-size:28px;font-weight:700;color:var(--uc)}
.result .interp{font-weight:600;margin-top:4px}
.result.ok{background:var(--ok-bg);border-color:#bfe3cc}.result.ok .score{color:var(--ok)}
.result.warn{background:var(--warn-bg);border-color:#efd58a}.result.warn .score{color:var(--warn)}
.result.bad{background:var(--bad-bg);border-color:#f3bcbc}.result.bad .score{color:var(--bad)}
.ref{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}

/* Checklist */
.check label{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:8px;background:#fff;min-height:var(--tap)}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--uc);flex-shrink:0}
.check input[type=text]{flex:1;border:0;border-bottom:1px dashed var(--line);padding:4px 2px;background:transparent;min-width:0}
.check label:has(input:checked) input[type=text]{text-decoration:line-through;color:var(--muted)}
.check .del{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;min-width:36px}

/* Directorio */
.dir-sec{margin-bottom:16px}
.dir-sec h2{display:flex;align-items:center;justify-content:space-between;font-size:16px;color:var(--uc);margin:0 0 8px}
.contact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  display:flex;gap:10px;align-items:center}
.contact .info{flex:1;min-width:0}
.contact .info b{display:block;font-size:15px}
.contact .info span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.contact .acts{display:flex;gap:6px;flex-direction:column}
.contact a.btn,.contact button.btn{min-height:38px;padding:4px 10px;font-size:13px}
.empty{font-size:14px;color:var(--muted);font-style:italic;padding:6px 2px}

/* Recursos */
.link{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:8px;text-decoration:none;color:var(--text);min-height:60px}
.link b{display:block;font-size:15px;color:var(--uc)}
.link span{font-size:13px;color:var(--muted)}
.link .del{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}

/* Modal simple */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:17px;color:var(--uc)}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}
nav.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
nav.bottom button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.active{color:var(--uc)}

footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:#1b2430;color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}

/* v0.2 — Tablas (semana tipo, sedes) */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -4px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
table.tbl th{background:var(--uc-soft);color:var(--uc);font-weight:600;white-space:nowrap}
table.tbl td.band{background:#eef1f5;font-weight:700;color:var(--muted);text-align:center;letter-spacing:2px}
table.tbl .fx{font-weight:600;color:var(--uc)}
table.tbl.sedes{min-width:0}
details{margin:8px 0}
details summary{cursor:pointer;font-weight:600;color:var(--uc-2);padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸ ';}
details[open] summary::before{content:'▾ ';}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--uc-soft);color:var(--uc);margin-right:4px}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}

/* Opciones compactas (Likert) */
.seg.c label{min-width:0;flex:1 1 0;padding:8px 4px;font-size:12px;justify-content:center;text-align:center;gap:4px;line-height:1.2}
.seg.c input{width:16px;height:16px}

/* Plantillas */
.tpl h3{display:flex;align-items:center;gap:8px}
.tpl .field{margin:8px 0}
.tpl .field label{font-size:13px}
.tpl .field textarea{min-height:64px}
.tpl .chk{display:flex;flex-wrap:wrap;gap:6px}
.tpl .chk label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;background:#fff;cursor:pointer}
.tpl .chk label:has(input:checked){border-color:var(--uc);background:var(--uc-soft);font-weight:600}
.tpl .chk input{width:16px;height:16px;accent-color:var(--uc)}
.sticky-actions{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px);background:rgba(244,246,249,.95);padding:8px 0;z-index:5;backdrop-filter:blur(4px)}
pre.copytxt{white-space:pre-wrap;word-break:break-word;font-size:13px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:50vh;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}

/* Glosario */
.gl dt{font-weight:700;color:var(--uc);margin-top:10px}
.gl dd{margin:2px 0 0;font-size:14px}
.search{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}

/* Pauta */
.pauta .crit{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.pauta .crit input[type=text]{border:0;border-bottom:1px dashed var(--line);padding:4px 2px;width:100%;background:transparent;font-weight:600}
.pauta .crit select{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px;width:100%}
.pauta .crit textarea{grid-column:1/3;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px;width:100%;font-size:13px}
.calimg{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:10px}
/* v0.3 — Banner de avisos, organigrama, calendarios 2026, Mi semana */
.banner{background:var(--warn-bg);border:1px solid #efd58a;border-left:5px solid var(--warn);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.banner .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--warn);margin-bottom:6px}
.banner pre.bt{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;margin:0}
.org{display:flex;flex-direction:column;align-items:center}
.org-lvl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;position:relative;padding-top:18px;width:100%}
.org-lvl::before{content:'';position:absolute;top:0;left:50%;width:2px;height:18px;background:var(--uc-2);opacity:.5}
.org-lvl.top{padding-top:0}.org-lvl.top::before{display:none}
.org-node{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1 1 120px;max-width:170px;text-align:center;font-size:12px;line-height:1.3}
.org-node b{display:block;font-size:13px;color:var(--uc);margin-bottom:2px}
.org-node span{color:var(--muted)}
.org-node.jefe{border-color:var(--uc);background:var(--uc-soft);max-width:280px;flex-basis:240px}
.org-node.area{background:#f7f9fb;border-style:dashed}
.contact.doc .info span{white-space:normal;overflow:visible}
.contact.doc .info span.rol{color:var(--text);margin:2px 0}
table.tbl.cal2026 td span.hoy{background:var(--warn-bg);border-radius:6px;padding:0 4px;font-weight:700}
table.tbl.cal2026 td span{white-space:nowrap}
table.tbl.ms{min-width:640px}
table.tbl.ms td{padding:4px}
table.tbl.ms textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;resize:vertical;background:#fff}
</style>
</head>

<script>
'use strict';
/* ========================= [JS-0] Utilidades y navegación ========================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('No se pudo guardar (almacenamiento no disponible)'); } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
/* Borradores clínicos: solo sessionStorage (se borran al cerrar). */
const sess = {
  get(k, def) { try { const v = sessionStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* Copiar texto plano al portapapeles (con respaldo para file:// y navegadores antiguos). */
function copyText(txt, label) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove(); return ok;
  };
  const done = ok => toast(ok ? (label || 'Copiado al portapapeles') : 'No se pudo copiar automáticamente: seleccione el texto de la vista previa');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), () => done(fallback()));
  else done(fallback());
}
function previewCopy(title, txt) {
  openModal(`<h2>${esc(title)}</h2><p class="muted">Vista previa del texto plano. Pegar en TrakCare.</p><pre class="copytxt" id="pvTxt">${esc(txt)}</pre>
    <div class="row" style="margin-top:10px"><button class="btn" id="pvCopy">Copiar</button><button class="btn ghost" id="pvClose">Cerrar</button></div>`);
  $('#pvCopy').onclick = () => copyText(txt);
  $('#pvClose').onclick = closeModal;
}

const TABS = {
  rotacion: { title: 'Rotación', sub: 'Avisos · semana tipo · poli SJ · fin de semana · reglas' },
  plant:    { title: 'Plantillas', sub: 'Ingreso HGG · entrega · IC · evolución' },
  calc:     { title: 'Calculadoras', sub: 'Escalas de uso frecuente en Geriatría' },

function renderRotacion() {
  const v = $('#view-rotacion');
  v.innerHTML = ROTACION_HTML;
  $('#avisoBox').innerHTML = avisoHTML(); bindAviso(renderRotacion);
  $('#sjBox').innerHTML = sjHTML();
  $('#fdsBox').innerHTML = fdsHTML();
  renderChecklist();
  $('#chkAdd').onclick = () => { const l = store.get('chk', CHECK_DEFAULT); l.push({ t: '', d: false }); store.set('chk', l); renderChecklist(true); };
  $('#chkReset').onclick = () => { if (confirm('¿Restablecer el checklist original?')) { store.set('chk', CHECK_DEFAULT); renderChecklist(); } };
}
function renderChecklist(focusLast) {
  const list = store.get('chk', CHECK_DEFAULT);
  const box = $('#checklist');
  box.innerHTML = list.map((it, i) => `
    <label>
      <input type="checkbox" data-i="${i}" ${it.d ? 'checked' : ''}>
      <input type="text" data-i="${i}" value="${esc(it.t)}" placeholder="Escribir ítem…">
      <button class="del" data-i="${i}" aria-label="Eliminar">×</button>
    </label>`).join('');
  box.onchange = e => {
    const i = +e.target.dataset.i; const l = store.get('chk', CHECK_DEFAULT);
    if (e.target.type === 'checkbox') l[i].d = e.target.checked; else l[i].t = e.target.value;
    store.set('chk', l);
  };
  box.onclick = e => {
    if (e.target.classList.contains('del')) {
      e.preventDefault(); const l = store.get('chk', CHECK_DEFAULT); l.splice(+e.target.dataset.i, 1); store.set('chk', l); renderChecklist();
    }
  };
  if (focusLast) { const ins = $$('input[type=text]', box); if (ins.length) ins[ins.length - 1].focus(); }
}

/* ---- Índice de comorbilidad de Charlson (clásico) ---- */
CALCS.push({
  id: 'charlson', abbr: 'CCI', name: 'Índice de Charlson', desc: 'Comorbilidad (versión clásica 1987) ± ajuste por edad',
  type: 'items', mode: 'check',
  items: [
    ['Infarto agudo al miocardio', 1], ['Insuficiencia cardíaca congestiva', 1], ['Enfermedad vascular periférica', 1],
    ['Enfermedad cerebrovascular (ACV/AIT)', 1], ['Demencia', 1], ['Enfermedad pulmonar crónica', 1],
    ['Enfermedad del tejido conectivo', 1], ['Úlcera péptica', 1], ['Hepatopatía leve', 1], ['Diabetes sin daño de órgano blanco', 1],
    ['Hemiplejia', 2], ['Enfermedad renal moderada o severa', 2], ['Diabetes con daño de órgano blanco', 2],
    ['Tumor sólido sin metástasis', 2], ['Leucemia', 2], ['Linfoma', 2],
    ['Hepatopatía moderada o severa', 3],
    ['Tumor sólido metastásico', 6], ['SIDA', 6]
  ],
  extra: `<div class="field"><label>Edad (opcional, para índice ajustado)</label><input type="number" name="age" inputmode="numeric" placeholder="años"></div>`,
  interpret(s, root) {
    const age = +($('input[name=age]', root)?.value || 0);
    let agePts = 0;
    if (age >= 50) agePts = Math.min(4, Math.floor((age - 40) / 10));
    const total = s + agePts;
    const survN = Math.round(100 * Math.pow(0.983, Math.exp(total * 0.9)));
    const surv = survN < 1 ? '< 1' : String(survN);
    const base = s === 0 ? 'Sin comorbilidad' : s <= 2 ? 'Comorbilidad baja' : s <= 4 ? 'Comorbilidad moderada' : 'Comorbilidad alta';
    return { interp: base, cls: s <= 2 ? 'ok' : s <= 4 ? 'warn' : 'bad',
      scoreLabel: agePts ? `${s} (ajustado por edad: ${total})` : String(s),
      detail: agePts ? `Supervivencia estimada a 10 años ≈ ${surv}% (índice ajustado por edad; estimación orientativa).` : 'Ingrese edad para calcular el índice ajustado y la supervivencia estimada a 10 años.' };
  },
  ref: 'Charlson ME, et al. J Chronic Dis 1987;40:373-83. Ajuste por edad: Charlson 1994.'
});

/* ---- Cockcroft-Gault ---- */
CALCS.push({
  id: 'cg', abbr: 'CrCl', name: 'Cockcroft-Gault', desc: 'Aclaramiento de creatinina estimado',
  type: 'custom',
  render() {
    return `<div class="field"><label>Edad (años)</label><input type="number" name="age" inputmode="numeric"></div>
      <div class="field"><label>Peso (kg)</label><input type="number" name="wt" inputmode="decimal" step="0.1"></div>
      <div class="field"><label>Creatinina plasmática (mg/dL)</label><input type="number" name="cr" inputmode="decimal" step="0.01"></div>
      <div class="field"><label>Sexo</label><div class="seg"><label><input type="radio" name="sex" value="m">Hombre</label><label><input type="radio" name="sex" value="f">Mujer</label></div></div>
      <div class="field"><label>Talla (cm, opcional: muestra peso ideal/ajustado)</label><input type="number" name="ht" inputmode="numeric"></div>`;
  },
  calc(root) {
    const age = +$('[name=age]', root).value, wt = +$('[name=wt]', root).value, cr = +$('[name=cr]', root).value;
    const sx = $('input[name=sex]:checked', root), ht = +$('[name=ht]', root).value;
    if (!age || !wt || !cr || !sx) return null;
    const f = sx.value === 'f' ? 0.85 : 1;
    const crcl = (140 - age) * wt / (72 * cr) * f;
    let extra = '';
    if (ht) {
      const ibw = (sx.value === 'f' ? 45.5 : 50) + 0.9 * (ht - 152.4);
      const bmi = wt / Math.pow(ht / 100, 2);
      if (bmi >= 30 && ibw > 0) {
        const abw = ibw + 0.4 * (wt - ibw);
        const crclA = (140 - age) * abw / (72 * cr) * f;
        extra = `IMC ${bmi.toFixed(1)}: en obesidad se sugiere peso ajustado (${abw.toFixed(0)} kg) → CrCl ≈ ${crclA.toFixed(0)} mL/min.`;
      } else if (bmi < 18.5) {
        extra = `IMC ${bmi.toFixed(1)}: en bajo peso usar peso real (ya aplicado).`;
      }
    }
    const cls = crcl >= 60 ? 'ok' : crcl >= 30 ? 'warn' : 'bad';
    const st = crcl >= 90 ? 'Función renal normal' : crcl >= 60 ? 'Reducción leve' : crcl >= 45 ? 'Reducción leve-moderada' : crcl >= 30 ? 'Reducción moderada-severa' : crcl >= 15 ? 'Reducción severa' : 'Falla renal';
    return { score: `${crcl.toFixed(0)} mL/min`, interp: st, cls,
      detail: 'Usar para ajuste de dosis (p. ej. anticoagulantes orales directos, antibióticos). En adultos mayores con sarcopenia la creatinina sobreestima la función renal. ' + extra };
  },
  ref: 'Cockcroft DW, Gault MH. Nephron 1976;16:31-41.'
});

/* ---- CHA2DS2-VASc + HAS-BLED ---- */
CALCS.push({
  id: 'fa', abbr: 'FA', name: 'CHA₂DS₂-VASc + HAS-BLED', desc: 'Riesgo embólico y de sangrado en FA',
  type: 'custom',
  chads: [
    ['Insuficiencia cardíaca / disfunción VI', 1], ['Hipertensión arterial', 1], ['Edad ≥ 75 años', 2], ['Diabetes mellitus', 1],
    ['ACV / AIT / tromboembolismo previo', 2], ['Enfermedad vascular (IAM previo, EAP, placa aórtica)', 1], ['Edad 65–74 años', 1], ['Sexo femenino', 1]
  ],
  hasbled: [
    ['Hipertensión no controlada (PAS > 160 mmHg)', 1], ['Función renal alterada (diálisis, trasplante, Cr > 2,26 mg/dL)', 1],
    ['Función hepática alterada (cirrosis, bilirrubina > 2× o transaminasas > 3×)', 1], ['ACV previo', 1],
    ['Historia o predisposición a sangrado (anemia)', 1], ['INR lábil (TRT < 60%)', 1], ['Edad > 65 años', 1],
    ['Fármacos (antiplaquetarios, AINE)', 1], ['Alcohol ≥ 8 tragos/semana', 1]
  ],
  render() {
    const mk = (arr, n) => `<div class="opt">${arr.map((x, i) => `<label><input type="checkbox" name="${n}" value="${x[1]}" data-i="${i}"><span>${x[0]}</span><span class="pts">+${x[1]}</span></label>`).join('')}</div>`;
    return `<div class="qtitle">CHA₂DS₂-VASc (riesgo embólico)</div>${mk(this.chads, 'ch')}
      <div class="qtitle" style="margin-top:20px">HAS-BLED (riesgo de sangrado)</div>${mk(this.hasbled, 'hb')}`;
  },
  calc(root) {
    const sum = n => $$(`input[name=${n}]:checked`, root).reduce((a, b) => a + +b.value, 0);

    const hTxt = h >= 3 ? 'HAS-BLED ≥ 3: riesgo de sangrado alto → corregir factores modificables y controlar más seguido; NO es contraindicación por sí mismo.' : 'HAS-BLED bajo-moderado.';
    return { score: `CHA₂DS₂-VASc ${c} · HAS-BLED ${h}`, interp: cTxt, cls: cCls,
      detail: hTxt + (female ? ' (El sexo femenino se contabiliza como modificador de riesgo: la indicación se basa en los otros factores.)' : '') + ' En el adulto mayor, caídas y fragilidad no contraindican por sí solas la anticoagulación.' };

CALCS.push({
  id: 'tug', abbr: 'TUG', name: 'Timed Up and Go', desc: 'Movilidad y riesgo de caídas',
  type: 'custom',
  render() {
    return `<p class="muted">Paciente sentado en silla con apoyabrazos. A la señal: se levanta, camina 3 metros a paso habitual, gira, vuelve y se sienta. Puede usar su ayuda técnica habitual. Cronometrar desde la señal hasta que se sienta.</p>

/* ---- IMC adulto mayor ---- */
CALCS.push({
  id: 'imc', abbr: 'IMC', name: 'IMC adulto mayor', desc: 'Índice de masa corporal con puntos de corte MINSAL (≥ 65 años)',
  type: 'custom',
  render() {
    return `<div class="field"><label>Peso (kg)</label><input type="number" name="wt" inputmode="decimal" step="0.1"></div>
      <div class="field"><label>Talla (cm)</label><input type="number" name="ht" inputmode="numeric"></div>
      <p class="muted">Si no se puede medir de pie, estimar talla por altura de rodilla o envergadura.</p>`;
  },
  calc(root) {
    const wt = +$('[name=wt]', root).value, ht = +$('[name=ht]', root).value; if (!wt || !ht) return null;
    const b = wt / Math.pow(ht / 100, 2);
    let interp, cls;
    if (b <= 23) { interp = 'Enflaquecido (≤ 23)'; cls = 'bad'; }
    else if (b < 28) { interp = 'Normal (23,1 – 27,9)'; cls = 'ok'; }
    else if (b < 32) { interp = 'Sobrepeso (28 – 31,9)'; cls = 'warn'; }
    else { interp = 'Obesidad (≥ 32)'; cls = 'bad'; }
    return { score: b.toFixed(1), interp, cls, detail: 'Puntos de corte para personas ≥ 65 años según EMPAM (MINSAL Chile). Complementar con pérdida de peso reciente, circunferencia de pantorrilla (< 31 cm sugiere sarcopenia) y MNA-SF.' };
  },
  ref: 'MINSAL Chile. Manual de aplicación del Examen de Medicina Preventiva del Adulto Mayor (EMPAM).'
});

/* ---- CKD-EPI 2021 ---- */
CALCS.push({
  id: 'ckdepi', abbr: 'VFG', name: 'CKD-EPI 2021', desc: 'VFG estimada por creatinina, sin coeficiente de raza',
  type: 'custom',
  render() {
    return `<div class="field"><label>Edad (años)</label><input type="number" name="age" inputmode="numeric"></div>
      <div class="field"><label>Creatinina plasmática (mg/dL)</label><input type="number" name="cr" inputmode="decimal" step="0.01"></div>
      <div class="field"><label>Sexo</label><div class="seg"><label><input type="radio" name="sex" value="m">Hombre</label><label><input type="radio" name="sex" value="f">Mujer</label></div></div>
      <p class="muted">En sarcopenia o bajo peso la creatinina sobreestima la VFG: considerar cistatina C o Cockcroft-Gault para ajuste de fármacos.</p>`;
  },
  calc(root) {
    const age = +$('[name=age]', root).value, cr = +$('[name=cr]', root).value, sx = $('input[name=sex]:checked', root);
    if (!age || !cr || !sx) return null;
    const f = sx.value === 'f';
    const k = f ? 0.7 : 0.9, a = f ? -0.241 : -0.302;
    const r = cr / k;
    const egfr = 142 * Math.pow(Math.min(r, 1), a) * Math.pow(Math.max(r, 1), -1.2) * Math.pow(0.9938, age) * (f ? 1.012 : 1);
    let st, cls;
    if (egfr >= 90) { st = 'G1 · Normal o alta'; cls = 'ok'; }
    else if (egfr >= 60) { st = 'G2 · Levemente disminuida'; cls = 'ok'; }
    else if (egfr >= 45) { st = 'G3a · Leve a moderadamente disminuida'; cls = 'warn'; }
    else if (egfr >= 30) { st = 'G3b · Moderada a severamente disminuida'; cls = 'warn'; }
    else if (egfr >= 15) { st = 'G4 · Severamente disminuida'; cls = 'bad'; }
    else { st = 'G5 · Falla renal'; cls = 'bad'; }
    return { score: `${egfr.toFixed(0)} mL/min/1,73 m²`, interp: st, cls,
      detail: 'ERC requiere VFG < 60 por > 3 meses o marcadores de daño renal (albuminuria). Categoría KDIGO por VFG; completar con albuminuria (A1–A3). Para dosis de fármacos, muchas fichas técnicas usan Cockcroft-Gault.' };
  },
  ref: 'Inker LA, et al. N Engl J Med 2021;385:1737-49. KDIGO 2024 CKD Guideline.'
});

CALCS.push({
  id: 'sppb', abbr: 'SPPB', name: 'SPPB', desc: 'Short Physical Performance Battery: equilibrio, marcha 4 m, levantarse 5 veces (0–12)',
  type: 'custom',
  render() {
    return `<div class="qtitle">1. Equilibrio (mantener 10 s cada posición)</div>
      <div class="qhelp">Pies juntos → semitándem → tándem. Si no logra 10 s en una posición, no se prueba la siguiente.</div>
      <div class="opt">
        <label><input type="radio" name="bal" value="0"><span>Pies juntos &lt; 10 s o no lo intenta</span><span class="pts">0</span></label>
        <label><input type="radio" name="bal" value="1"><span>Pies juntos 10 s; semitándem &lt; 10 s</span><span class="pts">1</span></label>
        <label><input type="radio" name="bal" value="2"><span>Semitándem 10 s; tándem &lt; 3 s</span><span class="pts">2</span></label>
        <label><input type="radio" name="bal" value="3"><span>Semitándem 10 s; tándem 3–9,99 s</span><span class="pts">3</span></label>
        <label><input type="radio" name="bal" value="4"><span>Tándem 10 s</span><span class="pts">4</span></label>
      </div>
      <div class="qtitle">2. Velocidad de marcha (4 metros, paso habitual, mejor de 2 intentos)</div>
      <div class="field"><label>Tiempo (segundos) — dejar vacío si no puede</label><input type="number" name="gait" inputmode="decimal" step="0.01"></div>
      <div class="qtitle">3. Levantarse de la silla 5 veces (brazos cruzados)</div>
      <div class="qhelp">Primero una vez sin brazos; si lo logra, cronometrar 5 repeticiones.</div>
      <div class="field"><label>Tiempo (segundos) — dejar vacío si no puede o &gt; 60 s</label><input type="number" name="chair" inputmode="decimal" step="0.01"></div>`;
  },
  calc(root) {
    const b = $('input[name=bal]:checked', root); if (!b) return null;
    const g = +$('[name=gait]', root).value, c = +$('[name=chair]', root).value;
    const gp = !g ? 0 : g > 8.7 ? 1 : g > 6.2 ? 2 : g > 4.82 ? 3 : 4;
    const cp = !c || c > 60 ? 0 : c > 16.7 ? 1 : c > 13.69 ? 2 : c > 11.19 ? 3 : 4;
    const s = +b.value + gp + cp;
    const vel = g ? ` · velocidad ${(4 / g).toFixed(2)} m/s` : '';
    let interp, cls;
    if (s <= 3) { interp = 'Limitación severa'; cls = 'bad'; }
    else if (s <= 6) { interp = 'Limitación moderada'; cls = 'bad'; }
    else if (s <= 9) { interp = 'Limitación leve'; cls = 'warn'; }
    else { interp = 'Rendimiento físico bueno'; cls = 'ok'; }
    return { score: `${s} / 12`, interp, cls,
      detail: `Equilibrio ${b.value} · marcha ${gp} · silla ${cp}${vel}. SPPB < 10 predice discapacidad incidente y es criterio de sarcopenia severa (EWGSOP2 ≤ 8). Velocidad de marcha ≤ 0,8 m/s: bajo rendimiento físico.` };
  },
  ref: 'Guralnik JM, et al. J Gerontol 1994;49:M85-94. Cruz-Jentoft AJ, et al. EWGSOP2, Age Ageing 2019;48:16-31.'
});

/* ---- Render del menú y de cada calculadora ---- */
function renderCalcMenu() {
  calcOpen = null;
  setHeader(TABS.calc.title, TABS.calc.sub, null);
  $('#view-calc').innerHTML = `<input class="search" type="search" id="calcQ" placeholder="Buscar escala… (ej. delirium, caídas, nutrición)" autocomplete="off">
    <div class="list" id="calcList">${CALCS.map(c => `
    <button class="item" data-id="${c.id}" data-n="${esc((c.name + ' ' + c.desc + ' ' + c.abbr).toLowerCase())}"><div class="ic">${c.abbr}</div><div class="t"><b>${c.name}</b><span>${c.desc}</span></div><div class="chev">›</div></button>`).join('')}</div>
    <p class="muted" style="margin-top:14px">${CALCS.length} escalas. Son apoyo a la valoración geriátrica integral; interpretar siempre en contexto clínico.</p>`;
  $('#view-calc').onclick = e => { const b = e.target.closest('.item'); if (b) openCalc(b.dataset.id); };
  $('#calcQ').oninput = e => { const t = e.target.value.trim().toLowerCase(); $$('#calcList .item').forEach(b => { b.style.display = !t || b.dataset.n.includes(t) ? '' : 'none'; }); };
  window.scrollTo(0, 0);
}

function openCalc(id) {
  const c = CALCS.find(x => x.id === id); if (!c) return;
  calcOpen = id;
  setHeader(c.name, c.desc, renderCalcMenu);
  let body = c.pre || '';
  if (c.type === 'items') {
    if (c.help) body += `<p class="muted">${c.help}</p>`;
    if (c.mode === 'radio') {
      if (c.compact) {
        body += c.items.map((it, i) => `<div class="qtitle">${i + 1}. ${it[0]}</div><div class="seg c">${it[1].map(o =>
          `<label><input type="radio" name="q${i}" value="${o[0]}">${o[1]}</label>`).join('')}</div>`).join('');
      } else {
        body += c.items.map((it, i) => `<div class="qtitle">${i + 1}. ${it[0]}</div><div class="opt">${it[1].map(o =>
          `<label><input type="radio" name="q${i}" value="${o[0]}"><span>${o[1]}</span><span class="pts">${o[0]}</span></label>`).join('')}</div>`).join('');
      }
    } else {
      body += `<div class="opt">${c.items.map((it, i) => `<label><input type="checkbox" name="q" value="${it[1]}"><span>${it[0]}</span><span class="pts">+${it[1]}</span></label>`).join('')}</div>`;
    }
    if (c.extra) body += c.extra;
  } else {
    body += c.render();
  }
  $('#view-calc').innerHTML = `<div class="card" id="calcForm">${body}
    <div class="row" style="margin-top:16px"><button class="btn" id="calcGo">${c.btnLabel || 'Calcular'}</button><button class="btn ghost" id="calcClr">Limpiar</button></div>
    <div id="calcOut"></div>
    <div class="ref">Ref.: ${c.ref}</div></div>`;
  $('#view-calc').onclick = null;
  const root = $('#calcForm');
  if (typeof c.afterRender === 'function') c.afterRender(root);
  const run = () => {
    let r = null;
    if (c.type === 'items') {
      if (c.mode === 'radio') {
        const vals = c.items.map((_, i) => $(`input[name=q${i}]:checked`, root));
        if (vals.some(v => !v)) { toast('Faltan ítems por responder'); return; }
        const s = vals.reduce((a, v) => a + +v.value, 0); r = Object.assign({ score: `${s} / ${maxItems(c)}` }, c.interpret(s, root));
      } else {
        const s = $$('input[name=q]:checked', root).reduce((a, v) => a + +v.value, 0);
        r = c.interpret(s, root); r.score = r.scoreLabel || String(s);
      }
    } else {
      r = c.calc(root);
      if (!r) { if (c.id !== 'frax') toast('Complete todos los campos'); return; }
    }
    $('#calcOut').innerHTML = `<div class="result ${r.cls || ''}"><div class="score">${r.score}</div><div class="interp">${r.interp}</div>${r.detail ? `<p class="muted" style="margin-top:6px">${r.detail}</p>` : ''}
      <div class="row" style="margin-top:10px"><button class="btn secondary sm" id="calcCopy">Copiar resultado</button></div></div>`;
    $('#calcCopy').onclick = () => copyText(`${c.name}: ${r.score} — ${r.interp}${r.detail ? '. ' + r.detail : ''}`.replace(/<[^>]+>/g, ''));
    $('#calcOut').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  $('#calcGo').onclick = run;
  $('#calcClr').onclick = () => { $$('input,textarea', root).forEach(i => { if (i.type === 'radio' || i.type === 'checkbox') i.checked = false; else i.value = ''; }); $('#calcOut').innerHTML = ''; };
  window.scrollTo(0, 0);
}
function maxItems(c) { return c.items.reduce((a, it) => a + Math.max(...it[1].map(o => o[0])), 0); }

/* ========================= [JS-3] Directorio ========================= */
/* Todos los valores iniciales están VACÍOS a propósito: completar desde la app o importando un JSON. */
const DIR_SECTIONS = [
  'Secretarias', 'Especialistas de turno', 'UC en Casa / Hospitalización domiciliaria',
  'Farmacia', 'Kinesiología', 'Trabajo social', 'Urgencias'
];
function dirData() {
  const d = store.get('dir', {});
  DIR_SECTIONS.forEach(s => { if (!Array.isArray(d[s])) d[s] = []; });
  return d;
}
function renderDir() {
  const d = dirData();
  const v = $('#view-dir');
  v.innerHTML = `
    <div class="note">Directorio del servicio. Los datos se guardan solo en este celular; use <b>Exportar</b> para compartir el JSON con el resto del equipo e <b>Importar</b> para cargarlo. Al distribuir la app, el equipo docente puede dejar un directorio base importado.</div>
    ${DIR_SECTIONS.map(s => `
      <div class="dir-sec">
        <h2>${s} <button class="btn secondary sm" data-add="${esc(s)}">+ Agregar</button></h2>
        ${d[s].length ? d[s].map((c, i) => contactHTML(s, c, i)).join('') : '<div class="empty">[completar] — sin contactos aún</div>'}
      </div>`).join('')}
    <div class="row" style="margin-top:8px">
      <button class="btn secondary" id="dirExport">Exportar JSON</button>
      <button class="btn secondary" id="dirImport">Importar JSON</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="dirPaste">Pegar JSON manualmente</button></div>
    <input type="file" id="dirFile" accept="application/json,.json" style="display:none">`;
  v.onclick = e => {
    const add = e.target.closest('[data-add]'); if (add) return editContact(add.dataset.add, -1);
    const ed = e.target.closest('[data-edit]'); if (ed) return editContact(ed.dataset.sec, +ed.dataset.edit);
  };
  $('#dirExport').onclick = exportDir;
  $('#dirImport').onclick = () => $('#dirFile').click();
  $('#dirFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => importDir(rd.result); rd.readAsText(f);
  };
  $('#dirPaste').onclick = () => {
    openModal(`<h2>Pegar JSON del directorio</h2>
      <div class="field"><textarea id="pasteJson" placeholder='{"Secretarias":[{"n":"...","r":"...","t":"...","h":"..."}], ...}'></textarea></div>
      <div class="row"><button class="btn" id="pasteOk">Importar</button><button class="btn ghost" id="pasteCancel">Cancelar</button></div>`);
    $('#pasteOk').onclick = () => importDir($('#pasteJson').value);
    $('#pasteCancel').onclick = closeModal;
  };
}
function contactHTML(sec, c, i) {
  const tel = (c.t || '').replace(/[^\d+]/g, '');
  return `<div class="contact">
    <div class="info"><b>${esc(c.n) || '<span class="ph">[nombre]</span>'}</b>
      <span>${esc(c.r) || '[rol / unidad]'}</span>
      <span>${esc(c.t) || '[teléfono / anexo]'}${c.h ? ' · ' + esc(c.h) : ''}</span></div>
    <div class="acts">
      ${tel.length >= 4 ? `<a class="btn" href="tel:${esc(tel)}">Llamar</a>` : ''}
      <button class="btn ghost" data-sec="${esc(sec)}" data-edit="${i}">Editar</button>
    </div></div>`;
}
function editContact(sec, i) {
  const d = dirData(); const c = i >= 0 ? d[sec][i] : { n: '', r: '', t: '', h: '' };
  openModal(`<h2>${i >= 0 ? 'Editar' : 'Nuevo'} contacto · ${esc(sec)}</h2>
    <div class="field"><label>Nombre</label><input type="text" id="cN" value="${esc(c.n)}" placeholder="[completar]"></div>
    <div class="field"><label>Rol / unidad</label><input type="text" id="cR" value="${esc(c.r)}" placeholder="[completar]"></div>
    <div class="field"><label>Teléfono / anexo</label><input type="tel" id="cT" value="${esc(c.t)}" placeholder="[completar]"></div>
    <div class="field"><label>Horario</label><input type="text" id="cH" value="${esc(c.h)}" placeholder="[completar]"></div>
    <div class="row"><button class="btn" id="cSave">Guardar</button><button class="btn ghost" id="cCancel">Cancelar</button></div>
    ${i >= 0 ? '<div class="row" style="margin-top:8px"><button class="btn danger" id="cDel">Eliminar</button></div>' : ''}`);
  $('#cSave').onclick = () => {
    const nc = { n: $('#cN').value.trim(), r: $('#cR').value.trim(), t: $('#cT').value.trim(), h: $('#cH').value.trim() };
    if (!nc.n && !nc.t) { toast('Ingrese al menos nombre o teléfono'); return; }
    if (i >= 0) d[sec][i] = nc; else d[sec].push(nc);
    store.set('dir', d); closeModal(); renderDir(); toast('Guardado');
  };
  $('#cCancel').onclick = closeModal;
  if (i >= 0) $('#cDel').onclick = () => { if (confirm('¿Eliminar contacto?')) { d[sec].splice(i, 1); store.set('dir', d); closeModal(); renderDir(); } };
}
function exportDir() {
  const json = JSON.stringify(dirData(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

function importDir(text) {

      d[sec] = obj[sec].map(c => ({ n: String(c.n || ''), r: String(c.r || ''), t: String(c.t || ''), h: String(c.h || '') })); n += d[sec].length;
    });
    store.set('dir', d); closeModal(); renderDir(); toast(`Importados ${n} contactos`);

function renderPlantMenu() {

  $('#view-plant').onclick = e => { const b = e.target.closest('.item'); if (b) openTpl(b.dataset.id); };
  window.scrollTo(0, 0);
}

function openTpl(id) {
  const t = TPLS.find(x => x.id === id); if (!t) return;
  setHeader(t.name, t.desc, renderPlantMenu);
  const d = sess.get(tplKey(id), {});
  const fieldHTML = (f) => {
    const [k, label, type, opts] = f; const v = d[k];
    if (type === 'area') return `<div class="field"><label>${esc(label)}</label><textarea name="${k}">${esc(v || '')}</textarea></div>`;
    if (type === 'sel') return `<div class="field"><label>${esc(label)}</label><select name="${k}">${opts.map(o => `<option${v === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    if (type === 'chk') return `<div class="field"><label>${esc(label)}</label><div class="chk">${opts.map(o => `<label><input type="checkbox" name="${k}" value="${esc(o)}"${(v || []).includes(o) ? ' checked' : ''}>${esc(o)}</label>`).join('')}</div></div>`;
    return `<div class="field"><label>${esc(label)}</label><input type="text" name="${k}" value="${esc(v || '')}"></div>`;
  };
  $('#view-plant').innerHTML = `<div class="tpl" id="tplForm">
    ${t.note ? `<div class="note">${t.note}</div>` : ''}
    ${t.sections.map(s => `<div class="card"><h3>${esc(s.h)}</h3>${s.f.map(fieldHTML).join('')}</div>`).join('')}
    <div class="sticky-actions row"><button class="btn" id="tplCopy">Copiar texto</button><button class="btn secondary" id="tplPrev">Vista previa</button><button class="btn ghost" id="tplClr">Limpiar</button></div>
  </div>`;
  $('#view-plant').onclick = null;
  const root = $('#tplForm');
  const read = () => {
    const out = {};
    t.sections.forEach(s => s.f.forEach(f => {
      const [k, , type] = f;
      if (type === 'chk') out[k] = $$(`input[name="${k}"]:checked`, root).map(x => x.value);
      else out[k] = ($(`[name="${k}"]`, root).value || '').trim();
    }));
    return out;
  };
  root.addEventListener('input', () => sess.set(tplKey(id), read()));
  root.addEventListener('change', () => sess.set(tplKey(id), read()));
  const build = () => {
    const v = read(); const lines = [t.name.toUpperCase(), ''];
    t.sections.forEach(s => {
      const body = [];
      s.f.forEach(f => {
        const [k, label, type] = f; const val = v[k];
        const short = label.split(' (')[0].split(' — ')[0];
        if (type === 'chk') { if (val.length) body.push(short + ': ' + val.join(', ')); }
        else if (val && !/^\[no evaluado\]$/.test(val)) body.push((type === 'area' && val.includes('\n')) ? short + ':\n' + val : short + ': ' + val);
      });
      lines.push('== ' + s.h + ' ==');
      lines.push(body.length ? body.join('\n') : '[ ]');
      lines.push('');
    });
    return lines.join('\n').trim();
  };
  $('#tplCopy').onclick = () => copyText(build(), 'Texto copiado: pegar en TrakCare');
  $('#tplPrev').onclick = () => previewCopy(t.name, build());
  $('#tplClr').onclick = () => { if (confirm('¿Borrar todos los campos de esta plantilla?')) { sess.del(tplKey(id)); openTpl(id); } };
  window.scrollTo(0, 0);
}

function renderMas(sub) {
  const v = $('#view-mas');
  if (!sub) {
    setHeader(TABS.mas.title, TABS.mas.sub, null);
    const items = [
      ['equipo', 'EQ', 'Equipo y organigrama', 'Quién es quién · a quién acudir · sedes y días'],
      ['cal', 'CA', 'Calendarios 2026 · Mi semana', 'Supervisión SJ · fin de semana · Core · delirium · memoria · grilla editable'],
      ['check', 'CK', 'Checklists', 'Antidelirium · caídas · UPP · aspiración · desprescripción'],
      ['glos', 'GL', 'Glosario UC', 'UGA, Sala UC, UC en Casa, LET, IDDSI, HGG…'],
      ['pauta', 'PE', 'Pauta de evaluación', 'En construcción — borrador editable'],
      ['rec', 'RF', 'Recursos', 'Referencias y enlaces del servicio']
    ];
    v.innerHTML = `<div class="list">${items.map(i => `<button class="item" data-sub="${i[0]}"><div class="ic">${i[1]}</div><div class="t"><b>${i[2]}</b><span>${i[3]}</span></div><div class="chev">›</div></button>`).join('')}</div>`;
    v.onclick = e => { const b = e.target.closest('[data-sub]'); if (b) renderMas(b.dataset.sub); };
    window.scrollTo(0, 0); return;
  }
  v.onclick = null;
  const back = () => renderMas();
  if (sub === 'check') {
    setHeader('Checklists', 'Marcar lo hecho y copiar al registro', back);
    v.innerHTML = CHECKLISTS.map(c => `<details class="card" data-ck="${c.id}"><summary><b>${c.name}</b> <span class="muted">· ${c.desc}</span></summary>
      <div class="opt" style="margin-top:8px">${c.items.map((it, i) => `<label><input type="checkbox" value="${i}"><span>${it}</span></label>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-ckcopy="${c.id}">Copiar</button><button class="btn ghost sm" data-ckclr="${c.id}">Desmarcar</button></div></details>`).join('') +
      `<p class="muted" style="margin-top:12px">Las casillas no se guardan (uso por paciente). El texto copiado lista lo marcado como "[x]" y lo no marcado como "[ ]".</p>`;
    v.onclick = e => {
      const bc = e.target.closest('[data-ckcopy]'), bx = e.target.closest('[data-ckclr]');
      if (bc) {
        const c = CHECKLISTS.find(x => x.id === bc.dataset.ckcopy); const det = bc.closest('details');
        const boxes = $$('input[type=checkbox]', det);
        const txt = c.name.toUpperCase() + '\n' + c.items.map((it, i) => (boxes[i].checked ? '[x] ' : '[ ] ') + it).join('\n');
        copyText(txt);
      }
      if (bx) $$('input[type=checkbox]', bx.closest('details')).forEach(x => x.checked = false);
    };
  } else if (sub === 'glos') {
    setHeader('Glosario UC', 'Términos y abreviaturas de uso local', back);
    v.innerHTML = `<input class="search" type="search" id="glQ" placeholder="Buscar término…" autocomplete="off"><div class="card gl"><dl id="glList">${GLOSARIO.map(g => `<div data-n="${esc((g[0] + ' ' + g[1]).toLowerCase())}"><dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd></div>`).join('')}</dl></div>`;
    $('#glQ').oninput = e => { const t = e.target.value.trim().toLowerCase(); $$('#glList > div').forEach(d => d.style.display = !t || d.dataset.n.includes(t) ? '' : 'none'); };
  } else if (sub === 'pauta') {
    setHeader('Pauta de evaluación', 'Espacio reservado', back);
    const data = store.get('pauta', null) || PAUTA_DEFAULT.map(c => ({ c, n: '', t: '' }));
    v.innerHTML = `<div class="note warn"><b>En construcción — a definir con Dr. Gac / Dra. Hoyl.</b> Lo que sigue es un borrador genérico, <b>propuesta no oficial</b>, editable y guardado solo en este dispositivo. No corresponde a la pauta vigente de la Escuela de Medicina.</div>
      <div class="card pauta" id="pautaForm"><h2>Borrador de criterios (escala 1–7)</h2>
      ${data.map((r, i) => `<div class="crit"><input type="text" data-c="${i}" value="${esc(r.c)}" placeholder="Criterio"><select data-n="${i}"><option value="">—</option>${[1, 2, 3, 4, 5, 6, 7].map(n => `<option${String(r.n) === String(n) ? ' selected' : ''}>${n}</option>`).join('')}</select><textarea data-t="${i}" placeholder="Comentario">${esc(r.t)}</textarea></div>`).join('')}
      <div class="row"><button class="btn secondary sm" id="pautaAdd">+ Criterio</button><button class="btn sm" id="pautaCopy">Copiar</button><button class="btn ghost sm" id="pautaReset">Restablecer</button></div>
      <p class="muted" id="pautaAvg" style="margin-top:8px"></p></div>`;
    const save = () => {
      const rows = $$('.crit', v).map(d => ({ c: $('input', d).value, n: $('select', d).value, t: $('textarea', d).value }));
      store.set('pauta', rows);
      const ns = rows.map(r => +r.n).filter(n => n > 0);
      $('#pautaAvg').textContent = ns.length ? `Promedio: ${(ns.reduce((a, b) => a + b, 0) / ns.length).toFixed(2)} (${ns.length} criterios evaluados de ${rows.length})` : 'Sin notas aún.';
    };
    $('#pautaForm').addEventListener('input', save); $('#pautaForm').addEventListener('change', save); save();
    $('#pautaAdd').onclick = () => { const rows = store.get('pauta', []); rows.push({ c: '', n: '', t: '' }); store.set('pauta', rows); renderMas('pauta'); };
    $('#pautaReset').onclick = () => { if (confirm('¿Restablecer el borrador de la pauta?')) { store.del('pauta'); renderMas('pauta'); } };
    $('#pautaCopy').onclick = () => { const rows = store.get('pauta', []); copyText('PAUTA DE EVALUACIÓN (BORRADOR NO OFICIAL)\n' + rows.map(r => `${r.c}: ${r.n || '[ ]'}${r.t ? ' — ' + r.t : ''}`).join('\n')); };
  } else if (sub === 'equipo') {
    setHeader('Equipo y organigrama', 'Docentes de Geriatría UC · sin teléfonos', back);
    v.innerHTML = equipoHTML();
  } else if (sub === 'cal') {
    setHeader('Calendarios 2026 · Mi semana', 'Fijos del año + grilla semanal', back);
    const link = store.get('calLink', '');
    const isImg = /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(link) || /^data:image\//i.test(link);
    v.innerHTML = `<div class="card"><h2>Calendario semanal de rotantes</h2>
      <p>Lo arma el Dr. González cada <b>domingo</b> y lo envía al grupo como imagen y por correo (grilla lun–vie, bandas mañana/tarde, "Docente (sede hora/box) — N" por rotante; rojo = docente ausente, naranjo = congreso / post-turno). Pegue aquí el link del Drive o de la imagen de la semana.</p>
      <div class="field"><label>Link (Drive / imagen)</label><input type="text" id="calUrl" inputmode="url" placeholder="https://…" value="${esc(link)}"></div>
      <div class="row"><button class="btn" id="calSave">Guardar</button>${link ? `<a class="btn secondary" target="_blank" rel="noopener" href="${esc(link)}">Abrir</a><button class="btn ghost" id="calDel">Quitar</button>` : ''}</div>
      ${link && isImg ? `<img class="calimg" src="${esc(link)}" alt="Calendario semanal">` : ''}
      ${link && !isImg ? `<p class="muted" style="margin-top:8px">El link no es una imagen directa; se abre en una pestaña nueva. Si es Drive, use "Abrir".</p>` : ''}
      <p class="muted" style="margin-top:10px">Recuerde: contactar al docente el día anterior; cambios de poli, turnos o ausencias avisarlos al coordinador apenas se sepan.</p></div>
      ${miSemanaHTML()}
      <div class="card"><h2>Calendarios fijos 2026</h2><p class="muted">Del maestro "CALENDARIOS 2026" (mantiene Dra. Bórquez; vive en la descripción del grupo). Reemplazos y permutas se avisan en el grupo.</p>
        <details open><summary>Supervisión Poli becados SJ (miércoles)</summary>${tablaSupervision()}</details>
        <details open><summary>Turnos de fin de semana</summary>${tablaFDS()}</details>
        <details><summary>Core Currículum (jueves 15:00–16:30)</summary>${tablaCore()}</details>
        <details><summary>Seminario de delirium (internos)</summary>${tablaDelirium()}</details>
        <details><summary>Reunión de memoria</summary>${tablaMemoria()}</details>
        <p class="muted" style="margin-top:8px">Fijos semanales: martes 08:00 reunión académica (Zoom) · jueves 14:00 reunión Edificio Académico 5A (o 3A / 6A) · jueves 15:00 Core · miércoles PM tarde académica Med Int · poli becados SJ mar/mié 14:00. En paros o marchas, reunión y Core pasan a Zoom.</p>
      </div>`;
    $('#calSave').onclick = () => { let u = $('#calUrl').value.trim(); if (u && !/^(https?:\/\/|data:image\/)/i.test(u)) u = 'https://' + u; store.set('calLink', u); renderMas('cal'); toast('Link guardado'); };
    const d = $('#calDel'); if (d) d.onclick = () => { store.del('calLink'); renderMas('cal'); };
    bindMiSemana(() => renderMas('cal'));
  } else if (sub === 'rec') {
    setHeader('Recursos', 'Referencias y enlaces propios', back);
    renderRec();
  }
  window.scrollTo(0, 0);
}

function fmtD(iso) { const [y, m, d] = iso.split('-'); const dt = new Date(+y, +m - 1, +d); return `${DIAS[dt.getDay()]} ${d}-${m}-${y}`; }
function hoyISO() { const t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function proximaSupervision() { const h = hoyISO(); return SUPERVISION_SJ.find(x => x[0] >= h) || null; }
function proximoFDS() { const h = hoyISO(); return TURNOS_FDS.find(x => x[1] >= h) || null; }
function mesDe(iso) { return MESES[+iso.slice(5, 7) - 1] + (iso.slice(0, 4) === '2026' ? '' : ' ' + iso.slice(0, 4)); }

  return `<div class="note">${ps ? `<b>Próxima supervisión SJ:</b> ${fmtD(ps[0])} · <b>Dr(a). ${esc(ps[1])}</b>` : 'Fuera del rango del calendario (jul–dic 2026).'}</div>

/* ---- Poli becados San Joaquín ---- */
function sjHTML() {
  return `<p><b>Qué es.</b> Policlínico docente de los <b>becados de Geriatría UC</b> en el Centro Médico San Joaquín. Sala espejo: <i>"en el 36, por atrás; hay una puerta justo antes del 36 por el pasillo"</i>.</p>
    <p><b>Cuándo.</b> <b>Martes y miércoles PM, 14:00</b>. Nunca lunes (el poli SJ del lunes no es de geriatría). Los becados de Medicina Interna tienen además su poli propio en SJ (solo PM), fuera del calendario de geriatría.</p>
    <p><b>Rol del rotante externo</b> (Med Int, Med Fam, internos, psiquiatría de enlace): <b>acompaña</b> a los becados; no atiende solo. Admite varios rotantes a la vez. Med Fam: poli becados <b>solo si no hay otra opción</b> (prioridad consulta con tutor propio).</p>
    <p><b>Regla de los martes y miércoles PM</b> (Dra. Born, 02-10-2026): <i>nadie se queda en Sala UC; si no hay consulta asignada, el rotante va a San Joaquín</i>.</p>
    <p><b>Supervisión.</b> La supervisión formal con staff rotativo es el <b>miércoles</b> (calendario abajo). El martes también se supervisa, con staff fijo/variable (Dra. Carrasco supervisa martes PM). Si va a supervisar o a acompañar, avise en el grupo qué rotantes irán: el error más frecuente es que el supervisor no sepa quién llega.</p>
    <h3>Supervisión rotativa de los miércoles · jul–dic 2026</h3>${tablaSupervision()}`;
}
/* ---- Turnos de fin de semana ---- */
function fdsHTML() {
  return `<p><b>Qué cubre.</b> La <b>visita de hospitalizados de Geriatría</b> (Sala UC Marcoleta e interconsultas) el sábado y domingo, más los feriados pegados al fin de semana, a cargo de un staff. No hay turnos de residencia nocturna de geriatría; el "turno" de los becados de Medicina Interna es su turno propio de Medicina Interna.</p>
    <p><b>Traspaso del viernes.</b> Quien lleva la sala en la semana pregunta la noche anterior quién pasa visita el fin de semana, para contarle los pacientes que quedaron. Si el calendario dice un nombre pero esa persona está ausente, se resuelve en el grupo.</p>

    <div class="note warn"><b>SOS UCI / Intermedio:</b> <b>no existe un esquema SOS de geriatría</b>. A quién llamar el fin de semana ante una urgencia de un paciente de Sala UC: <span class="ph">[completar a quién llamar]</span>. El Intermedio de San Carlos ofrece turnos remunerados de Medicina Interna (no es cobertura de geriatría).</div>

}

function miSemanaHTML() {

      <tr><th>AM</th>${MS_DIAS.map((_, i) => cell('am', i)).join('')}</tr>
      <tr><th>PM</th>${MS_DIAS.map((_, i) => cell('pm', i)).join('')}</tr></table></div>

    <p class="muted" id="msSaved" style="margin-top:6px"></p></div>`;
}
function bindMiSemana(rerender) {
  const t = $('#msTbl'); if (!t) return;
  const read = () => { const o = { am: [], pm: [] }; $$('textarea', t).forEach(x => { o[x.dataset.b][+x.dataset.i] = x.value; }); return o; };
  t.addEventListener('input', () => { store.set('misemana', read()); $('#msSaved').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }); });
  $('#msReset').onclick = () => { if (confirm('¿Volver a los fijos de la semana?')) { store.del('misemana'); rerender(); } };
  $('#msCopy').onclick = () => { const o = read(); copyText('MI SEMANA\n' + MS_DIAS.map((dn, i) => `${dn}\n  AM: ${o.am[i] || '—'}\n  PM: ${o.pm[i] || '—'}`).join('\n')); };
}
